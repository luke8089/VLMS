<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades Display Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <h1 class="text-2xl font-bold mb-6">Grades Display Test</h1>
    
    <!-- Summary Cards -->
    <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-gray-800 p-4 rounded-lg">
            <div class="text-3xl font-bold text-white" id="grade-total">-</div>
            <div class="text-sm text-gray-400 mt-1">Exams Taken</div>
        </div>
        <div class="bg-gray-800 p-4 rounded-lg">
            <div class="text-3xl font-bold text-white" id="grade-avg">Pending</div>
            <div class="text-sm text-gray-400 mt-1">Average Score</div>
        </div>
        <div class="bg-gray-800 p-4 rounded-lg">
            <div class="text-3xl font-bold text-white" id="grade-highest">0</div>
            <div class="text-sm text-gray-400 mt-1">Highest Score</div>
        </div>
    </div>
    
    <!-- Grades Table -->
    <div class="bg-gray-800 overflow-hidden rounded-lg">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-700 border-b border-gray-600">
                    <tr>
                        <th class="text-left py-3 px-4 font-medium text-gray-300">Course</th>
                        <th class="text-center py-3 px-4 font-medium text-gray-300">CAT 1</th>
                        <th class="text-center py-3 px-4 font-medium text-gray-300">CAT 2</th>
                        <th class="text-center py-3 px-4 font-medium text-gray-300">Main Exam</th>
                        <th class="text-center py-3 px-4 font-medium text-gray-300">Assignment</th>
                        <th class="text-center py-3 px-4 font-medium text-gray-300">Grade</th>
                        <th class="text-left py-3 px-4 font-medium text-gray-300">Date Released</th>
                    </tr>
                </thead>
                <tbody id="grades-table-body" class="divide-y divide-gray-700">
                    <tr><td colspan="7" class="py-8 text-center text-gray-500">Loading grades...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Helper function for grade letters
        function letterGrade(pct) {
            if (pct == null) return { letter: '-', color: 'text-gray-300 bg-gray-700' };
            if (pct >= 80) return { letter: 'A', color: 'text-white bg-green-500' };
            if (pct >= 70) return { letter: 'B', color: 'text-white bg-blue-500' };
            if (pct >= 60) return { letter: 'C', color: 'text-white bg-yellow-500' };
            if (pct >= 50) return { letter: 'D', color: 'text-white bg-orange-500' };
            return { letter: 'F', color: 'text-white bg-red-500' };
        }

        // Mock API data
        const mockData = {
            results: [
                {
                    exam_title: 'Cat 1',
                    course_title: 'Introduction to Programming',
                    exam_type: 'quiz',
                    total_score: 18.0,
                    total_marks: 30.0,
                    submitted_at: '2026-03-30T20:08:41',
                    submission_status: 'graded'
                },
                {
                    exam_title: 'Cat 2',
                    course_title: 'Introduction to Programming',
                    exam_type: 'midterm',
                    total_score: 15.0,
                    total_marks: 30.0,
                    submitted_at: '2026-03-25T08:55:12',
                    submission_status: 'graded'
                },
                {
                    exam_title: 'cat 1 oop',
                    course_title: 'object oriented programmming',
                    exam_type: 'quiz',
                    total_score: 25.0,
                    total_marks: 30.0,
                    submitted_at: '2026-03-26T11:39:56',
                    submission_status: 'graded'
                },
                {
                    exam_title: 'Cat 2',
                    course_title: 'object oriented programmming',
                    exam_type: 'midterm',
                    total_score: 22.0,
                    total_marks: 30.0,
                    submitted_at: '2026-03-26T15:27:25',
                    submission_status: 'graded'
                }
            ]
        };

        // Load grades page function
        function loadGradesPage() {
            const tbody = document.getElementById('grades-table-body');
            tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-gray-500">Loading grades...</td></tr>';
            
            try {
                const data = mockData; // Using mock data instead of API call
                const results = data.results || [];
                
                // Group results by course and assessment type
                const courseGroups = new Map();
                results.forEach(r => {
                    const courseTitle = r.course_title || 'Unknown Course';
                    if (!courseGroups.has(courseTitle)) {
                        courseGroups.set(courseTitle, {
                            courseTitle,
                            cat1: null,
                            cat2: null,
                            mainExam: null,
                            assignment: null,
                            latestDate: null
                        });
                    }
                    
                    const group = courseGroups.get(courseTitle);
                    const examType = (r.exam_type || '').toLowerCase();
                    const examTitle = (r.exam_title || '').toLowerCase();
                    
                    // Categorize by assessment type
                    if (examTitle.includes('cat 1') || examTitle.includes('cat1') || examType === 'quiz') {
                        group.cat1 = r;
                    } else if (examTitle.includes('cat 2') || examTitle.includes('cat2') || examType === 'midterm') {
                        group.cat2 = r;
                    } else if (examTitle.includes('main exam') || examTitle.includes('main_exam') || examTitle.includes('final') || examType === 'final') {
                        group.mainExam = r;
                    } else if (examType === 'assignment' || examTitle.includes('assignment')) {
                        group.assignment = r;
                    }
                    
                    // Track latest date
                    if (r.submitted_at) {
                        const date = new Date(r.submitted_at);
                        if (!group.latestDate || date > new Date(group.latestDate)) {
                            group.latestDate = r.submitted_at;
                        }
                    }
                });
                
                // Calculate overall grade for each course
                const courseGroupsArray = Array.from(courseGroups.values()).map(group => {
                    const scores = [];
                    const totalMarks = [];
                    
                    if (group.cat1 && group.cat1.total_score != null) {
                        scores.push(group.cat1.total_score);
                        totalMarks.push(group.cat1.total_marks);
                    }
                    if (group.cat2 && group.cat2.total_score != null) {
                        scores.push(group.cat2.total_score);
                        totalMarks.push(group.cat2.total_marks);
                    }
                    if (group.mainExam && group.mainExam.total_score != null) {
                        scores.push(group.mainExam.total_score);
                        totalMarks.push(group.mainExam.total_marks);
                    }
                    if (group.assignment && group.assignment.total_score != null) {
                        scores.push(group.assignment.total_score);
                        totalMarks.push(group.assignment.total_marks);
                    }
                    
                    // Calculate percentage
                    let percentage = null;
                    if (scores.length > 0 && totalMarks.length > 0) {
                        const totalScore = scores.reduce((a, b) => a + b, 0);
                        const totalPossible = totalMarks.reduce((a, b) => a + b, 0);
                        percentage = Math.round((totalScore / totalPossible) * 100);
                    }
                    
                    group.percentage = percentage;
                    group.gradeInfo = percentage != null ? letterGrade(percentage) : { letter: '-', color: 'text-gray-300 bg-gray-700' };
                    
                    return group;
                });
                
                document.getElementById('grade-total').textContent = courseGroupsArray.length;
                
                // Calculate average and highest only for courses with complete assessments
                const completeCourses = courseGroupsArray.filter(g => 
                    (g.cat1 && g.cat1.total_score != null) && 
                    (g.cat2 && g.cat2.total_score != null) && 
                    (g.mainExam && g.mainExam.total_score != null)
                );
                
                if (completeCourses.length > 0) {
                    const avgScore = Math.round(completeCourses.reduce((sum, g) => sum + g.percentage, 0) / completeCourses.length);
                    document.getElementById('grade-avg').textContent = avgScore + '%';
                    document.getElementById('grade-highest').textContent = Math.round(Math.max(...completeCourses.map(g => g.percentage))) + '%';
                }
                
                if (courseGroupsArray.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-gray-500">No exam results yet.</td></tr>';
                } else {
                    tbody.innerHTML = courseGroupsArray.map(group => {
                        const renderScore = (assessment) => {
                            if (!assessment) return '<span class="text-gray-500">—</span>';
                            if (assessment.total_score == null) return '<span class="text-gray-500">—</span>';
                            return `<span class="text-white font-medium">${assessment.total_score}/${assessment.total_marks}</span>`;
                        };
                        
                        return `
                            <tr class="hover:bg-gray-700 transition-colors">
                                <td class="py-3 px-4 text-white font-medium">${group.courseTitle}</td>
                                <td class="py-3 px-4 text-center">${renderScore(group.cat1)}</td>
                                <td class="py-3 px-4 text-center">${renderScore(group.cat2)}</td>
                                <td class="py-3 px-4 text-center">${renderScore(group.mainExam)}</td>
                                <td class="py-3 px-4 text-center">${renderScore(group.assignment)}</td>
                                <td class="py-3 px-4 text-center">
                                    <span class="px-2 py-1 rounded-full text-xs font-medium ${group.gradeInfo.color}">
                                        ${group.gradeInfo.letter}
                                    </span>
                                </td>
                                <td class="py-3 px-4 text-xs text-gray-400">${group.latestDate ? new Date(group.latestDate).toLocaleDateString() : '—'}</td>
                            </tr>
                        `;
                    }).join('');
                }
                
            } catch (error) {
                console.error('Error loading grades:', error);
                tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-red-500">Error loading grades. Please try again.</td></tr>';
            }
        }

        // Load grades when page loads
        document.addEventListener('DOMContentLoaded', loadGradesPage);
    </script>
</body>
</html>
